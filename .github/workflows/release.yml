name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)build a release for (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (linux arm64)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package
        id: pkg
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          name="ccmon-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/ccmon" "dist/${name}/ccmon"
          cp README.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          echo "archive=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${name}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ${{ steps.pkg.outputs.archive }}
            ${{ steps.pkg.outputs.checksum }}
          fail_on_unmatched_files: true

  tap:
    name: push formula to homebrew-tap
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: adamclark64/homebrew-tap
          ref: main
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          path: tap

      - name: Compute checksums + rewrite formula
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"

          fetch_sha() {
            local target="$1"
            local url="${base}/ccmon-${version}-${target}.tar.gz"
            curl -sSL "$url" | shasum -a 256 | awk '{print $1}'
          }

          arm_mac=$(fetch_sha aarch64-apple-darwin)
          intel_mac=$(fetch_sha x86_64-apple-darwin)
          intel_linux=$(fetch_sha x86_64-unknown-linux-gnu)
          arm_linux=$(fetch_sha aarch64-unknown-linux-gnu)

          mkdir -p tap/Formula
          cat > tap/Formula/ccmon.rb <<EOF
          class Ccmon < Formula
            desc "List running Claude Code agents & subagents, open a viewer in a new terminal tab"
            homepage "https://github.com/adamclark64/ccmon"
            version "${version}"
            license "MIT"

            depends_on "jq"
            depends_on "tmux"

            on_macos do
              on_arm do
                url "${base}/ccmon-${version}-aarch64-apple-darwin.tar.gz"
                sha256 "${arm_mac}"
              end
              on_intel do
                url "${base}/ccmon-${version}-x86_64-apple-darwin.tar.gz"
                sha256 "${intel_mac}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/ccmon-${version}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${arm_linux}"
              end
              on_intel do
                url "${base}/ccmon-${version}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${intel_linux}"
              end
            end

            def install
              bin.install "ccmon"
            end

            test do
              system bin/"ccmon", "--list"
            end
          end
          EOF

      - name: Commit + push to tap
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet Formula/ccmon.rb; then
            echo "no formula changes"
            exit 0
          fi
          git add Formula/ccmon.rb
          git commit -m "chore(ccmon): release ${RELEASE_TAG}"
          git push origin main
