[package]
name = "ccmon"
version = "0.1.2"
edition = "2021"
description = "List running Claude Code agents & subagents and attach a viewer in a new terminal tab"
license = "MIT"
repository = "https://github.com/adamclark64/ccmon"
homepage = "https://github.com/adamclark64/ccmon"
readme = "README.md"
keywords = ["claude", "claude-code", "tui", "agent", "tmux"]
categories = ["command-line-utilities"]
authors = ["Adam Clark"]

[[bin]]
name = "ccmon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.28"
dirs = "5"
ratatui = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[profile.release]
lto = "thin"
strip = true
